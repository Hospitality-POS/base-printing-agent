name: Build Installers (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.7.0)"
        required: true
        default: "v0.7.0"

jobs:
  # ── Step 1: create the GitHub Release once ────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.resolve-tag.outputs.tag }}";
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `PrintAgent ${tag}`,
                body: `## PrintAgent ${tag}\n\n### Download\n| Platform | File |\n|----------|------|\n| Windows 10/11 (desktop app) | \`PrintAgent_*_x64-setup.exe\` |\n| Windows 10/11 (MSI) | \`PrintAgent_*_x64_en-US.msi\` |\n| Windows 7/8/8.1+ 64-bit (browser + helper) | \`PrintAgentHelper-Setup-x64.exe\` |\n| Windows 7/8 32-bit (browser + helper) | \`PrintAgentHelper-Setup-x86.exe\` |\n\n### First Run\n1. Launch PrintAgent — it appears in the system tray\n2. Enter Company Code, select branch, route by category or location, pick your printer\n3. Click **Pair Device**`,
                draft: true,
                prerelease: false,
              });
              return data.id;
            } catch (e) {
              // Release already exists (e.g. re-run) — reuse it.
              // NOTE: getReleaseByTag does not return drafts; list does.
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 30,
              });
              const existing = releases.find((r) => r.tag_name === tag);
              if (!existing) throw e;
              console.log(`Reusing existing release ${existing.id} for tag ${tag}`);
              return existing.id;
            }

  # ── Step 2a: modern desktop app (Windows 10/11, WebView2) ────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          VER="${TAG#v}"
          echo "Syncing version to $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VER';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRINT_AGENT_API_URL: ${{ secrets.PRINT_AGENT_API_URL || 'https://api.hospitality.reliatech.co.ke' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc

  # ── Step 2b: legacy helper installers (Windows 7/8/8.1/10/11) ────────────
  # Browser UI + native helper — no WebView2 required. Built for the
  # dedicated Win7 targets so it runs on the oldest supported POS terminals.
  build-legacy-helper:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Nightly + rust-src is required for `-Z build-std` on the win7 targets.
      # (win7 targets have no prebuilt rust-std — std is compiled from source,
      # so we must NOT list them in `targets:`)
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web UI for helper
        run: |
          npm run build
          Copy-Item -Recurse -Force dist installer/web

      - name: Build helper (64-bit, Win7 target)
        working-directory: src-tauri
        run: cargo +nightly build -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc --release -p print-agent-helper

      - name: Build helper (32-bit, Win7 target)
        working-directory: src-tauri
        run: cargo +nightly build -Z build-std=std,panic_abort --target i686-win7-windows-msvc --release -p print-agent-helper

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build legacy installers
        working-directory: installer
        run: |
          Copy-Item ../src-tauri/target/x86_64-win7-windows-msvc/release/print-agent-helper.exe print-agent-helper-x64.exe
          Copy-Item ../src-tauri/target/i686-win7-windows-msvc/release/print-agent-helper.exe print-agent-helper-x86.exe
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DHELPER_EXE=print-agent-helper-x64.exe /DOUTFILE=PrintAgentHelper-Setup-x64.exe print-agent-helper.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DHELPER_EXE=print-agent-helper-x86.exe /DOUTFILE=PrintAgentHelper-Setup-x86.exe print-agent-helper.nsi

      - name: Upload legacy assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            installer/PrintAgentHelper-Setup-x64.exe
            installer/PrintAgentHelper-Setup-x86.exe
            installer/print-agent-helper-x64.exe
            installer/print-agent-helper-x86.exe

  # ── Step 3: publish the draft once all builds are attached ─────────────────
  publish-release:
    needs: [create-release, build-windows, build-legacy-helper]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }},
                draft: false,
              });
            } catch (error) {
              if (error.status === 404) {
                console.log('Release not found, creating new release instead');
                const tag = "${{ needs.create-release.outputs.tag }}";
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `PrintAgent ${tag}`,
                  body: `## PrintAgent ${tag}\n\n### Download\n| Platform | File |\n|----------|------|\n| Windows 10/11 (desktop app) | \`PrintAgent_*_x64-setup.exe\` |\n| Windows 7/8/8.1+ (browser + helper) | \`PrintAgentHelper-Setup-x64.exe\` |\n\n### First Run\n1. Launch PrintAgent — it appears in the system tray\n2. Enter Company Code, select branch, route by category or location, pick your printer\n3. Click **Pair Device**`,
                  draft: false,
                  prerelease: false,
                });
              } else {
                throw error;
              }
            }
